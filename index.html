<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0610">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#1a0610; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --text:#fbf1f3; --muted:#d9b8c2; --accent:#e8708f; --accent2:#f2c48d;
  --ok:#6ee7a8; --bad:#ff6b7a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);line-height:1.5;
  background:
    radial-gradient(1200px 700px at 15% -10%,#7a1535 0%,transparent 60%),
    radial-gradient(900px 600px at 110% 110%,#4a0b22 0%,transparent 55%),
    var(--bg);
  background-attachment:fixed;
  padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 12px}
h1{font-size:2.2rem} h2{font-size:1.6rem}
p{margin:0 0 14px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:600 1rem Inter,sans-serif;color:#2a0a14;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;margin-top:14px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;background:#8a6270;color:#2a0a14}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.dots{display:flex;gap:6px;margin-bottom:16px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:14px;padding:14px 16px;font:500 1rem Inter,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.opt:active{transform:scale(.99)}
.opt.ok{background:rgba(110,231,168,.18);border-color:var(--ok)}
.opt.bad{background:rgba(255,107,122,.16);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.5em;margin-top:14px;font-weight:500}
.pista{background:rgba(242,196,141,.1);border:1px dashed rgba(242,196,141,.55);border-radius:16px;padding:16px;margin:8px 0 18px;font-family:Fraunces,Georgia,serif;font-size:1.15rem;font-style:italic}
.cd{font-family:Fraunces,Georgia,serif;font-size:3rem;text-align:center;letter-spacing:.04em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.mc{perspective:600px;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer}
.mc .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;overflow:hidden;font-size:2rem;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{background:linear-gradient(135deg,#5a0f2a,#8c1d44);border:1px solid var(--line);color:var(--accent2)}
.face.front{background:#fff3f1;transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover}
.mc.done .face.front{box-shadow:0 0 0 3px var(--ok) inset}
.cap{min-height:3em;margin-top:14px;font-style:italic;color:var(--accent2)}
details{margin-bottom:14px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.04)}
summary{cursor:pointer;font-weight:600}
details p{margin:10px 0 0}
#temp{border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);transition:background .4s,border-color .4s;text-align:center}
#temp .big{font-family:Fraunces,Georgia,serif;font-size:1.6rem}
#map{height:min(55vh,460px);min-height:320px;border-radius:18px;border:1px solid var(--line);overflow:hidden}
.final-emoji{font-size:3rem;text-align:center;margin-bottom:6px}
.confetti{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
#dbg{position:fixed;right:8px;bottom:8px;z-index:99;background:#000c;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.75rem}
#dbg button,#dbg select{font:600 .75rem Inter,sans-serif;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#222;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   ✏️  CONFIGURACIÓN — todo lo que tienes que editar está aquí arriba
   ===================================================================== */
const CONFIG = {
  nombre: "Sarah",          // ✏️ su nombre / apodo
  waitMinutes: 50,         // tiempo de espera entre un reto y el siguiente

  portada: {
    titulo: "Hoy tengo algo para ti ✨",
    texto: "Te hice unos retos. Cada uno te va a dar una pista de a dónde vamos en la noche (plot twist mi mamá cumple el 6 de Febrero). Tómate tu tiempo… pero no tanto.",
    boton: "Empezar"
  },

  /* ---------- RETO 1: TRIVIA DE USTEDES ---------- */
  trivia: {
    titulo: "Reto 1 · ¿Qué tan bien nos conoces?",
    intro: "Son cuatro preguntas de cosas que han pasaado entre nosotros a lo largo desde nuestra primer salida.",
    preguntas: [
      // ✏️ Cambia preguntas, opciones y 'correcta' (índice de la opción correcta, empieza en 0)
      { q: "¿Que me pedi de tomar en nuestra primera salida?", opciones: ["Moka", "Café", "Soda Italiana"], correcta: 0, acierto: "Me mama el moka" },
      { q: "¿Cuál fue la primera pelicula que vimos juntos?",              opciones: ["La venganza del Charro Negro", "Resident Evil: Noche Cero", "Other Mommy"], correcta: 1, acierto: "Top salidas, me rei un monton" },
      { q: "¿Cuando fue nuestro primer beso?",                 opciones: ["26 de Octubre", "23 de Octubre", "24 de Octubre"], correcta: 2, acierto: "Fue despues de media nocheee ya era 24" },
      { q: "¿De las canciones de la lista cual me recuerda mas a como me siento contigo?",      opciones: ["2much", "chinita linda", "sigue asi"], correcta: 0, acierto: "2much porque siento demasiado por ti" }
    ],
    pista: "Es un lugar donde el silencio dice más que las palabras… y no, no es una biblioteca."   // ✏️ PISTA 1
  },

  /* ---------- RETO 2: MEMORAMA ---------- */
  memorama: {
    titulo: "Reto 2 · Memorama de nosotros",
    intro: "Encuentra las parejas. Cada una es un recuerdo.",
    // ✏️ 'emoji' siempre; 'img' es opcional (ruta a una foto de ustedes, ej. "fotos/1.jpg"). 'texto' sale al hacer match.
    pares: [
      { img: "fotos/guayabas.jpg", texto: "Guyabaaaaasss!" },
      { img: "fotos/dibujitos.jpg", texto: "La primera date mas seriaaa" },
      { img: "fotos/leooon.PNG", texto: "El mejor fin de mi vida" },
      { img: "fotos/pijamas.jpg", texto: "Cine en pijamaaa" },
      { img: "fotos/primerafoto.jpg", texto: "Nuestra primera foto juntosss" },
      { img: "fotos/primerapijamada.jpg", texto: "Nuestra primera pijamadaaa!" }
    ],
    pista: "Habrá cosas que nadan, cosas que se mueven despacito y mucha luz azul."   // ✏️ PISTA 2
  },

  /* ---------- RETO 3: MAPA CALIENTE / FRÍO ---------- */
  mapa: {
    titulo: "Reto 3 · Caliente o frío",
    intro: "Toca el mapa para poner tu pin y confirma. Te digo qué tan cerca estás de donde te espero.",
    // Coordenadas "lat,lng" en base64. Las de abajo son aprox. del Acuario Michin: ✏️ VERIFÍCALAS en Google Maps
    // (clic derecho en el punto exacto → copia lat,lng) y genera el base64 con:  btoa("20.692917,-103.35139")
    destinoB64: "MjAuNjkyOTE3LC0xMDMuMzUxMzk=",
    radioGanar: 150,   // metros: a esta distancia ya "lo encontró"
    // Rangos por distancia (metros). El último debe ser Infinity.
    rangos: [
      { hasta: 400,      label: "¡Ardiendo!", emoji: "🔥🔥🔥", color: "#ff3b30" },
      { hasta: 1200,     label: "Caliente",   emoji: "🔥",     color: "#ff7a1a" },
      { hasta: 3000,     label: "Tibio",      emoji: "🌤️",     color: "#f5c542" },
      { hasta: 7000,     label: "Frío",       emoji: "❄️",     color: "#5ac8fa" },
      { hasta: Infinity, label: "Helado",     emoji: "🧊",     color: "#3a7bd5" }
    ],
    pistaExtraTrasIntentos: 8,
    pistaExtra: "Pista extra: está cerca de un parque grande. 🌳",   // ✏️ opcional
    final: {
      titulo: "¡Ahí es! 🎉",
      texto: "Te espero aquí. Tengo algo importante que preguntarte.",   // ✏️
      lugar: "Acuario Michin",                                             // ✏️
      hora: "7:00 p.m."                                                    // ✏️
    }
  }
};

/* =====================================================================
   Lógica (no necesitas tocar de aquí para abajo)
   ===================================================================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const WAIT_MS = ((DEBUG && params.get('wait')) ? parseFloat(params.get('wait')) : CONFIG.waitMinutes) * 60000;
const KEY = 'pedida_v1';

const fresh = () => ({ stage: 'home', unlockAt: 0, q: 0 });
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { return fresh(); } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let timer = null;
function go(stage, extra) {
  S.stage = stage; Object.assign(S, extra || {}); save(); render(); window.scrollTo(0, 0);
}
function render() {
  clearInterval(timer);
  ({ home: homeView, trivia: triviaView, wait1: () => waitView(1, CONFIG.trivia.pista, 'memo'),
     memo: memoView, wait2: () => waitView(2, CONFIG.memorama.pista, 'map'),
     map: mapView, final: finalView }[S.stage] || homeView)();
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- Portada ---------- */
function homeView() {
  const P = CONFIG.portada;
  app.innerHTML = `<div class="card">
    <p class="eyebrow">Para ${CONFIG.nombre}</p>
    <h1>${P.titulo}</h1>
    <p class="muted">${P.texto}</p>
    <button class="btn" id="go">${P.boton}</button>
  </div>`;
  $('#go').onclick = () => go('trivia', { q: 0 });
}

/* ---------- Reto 1: trivia ---------- */
function triviaView() {
  const T = CONFIG.trivia, i = S.q;
  if (i >= T.preguntas.length) { return go('wait1', { unlockAt: Date.now() + WAIT_MS, q: 0 }); }
  const p = T.preguntas[i];
  app.innerHTML = `<div class="card">
    <p class="eyebrow">${T.titulo}</p>
    <div class="dots">${T.preguntas.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
    ${i === 0 ? `<p class="muted">${T.intro}</p>` : ''}
    <h2>${p.q}</h2>
    <div class="opts">${p.opciones.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="nx" hidden>Siguiente</button>
  </div>`;
  const opts = [...document.querySelectorAll('.opt')];
  opts.forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (k === p.correcta) {
      b.classList.add('ok'); opts.forEach(o => o.disabled = true);
      $('#fb').textContent = p.acierto || '¡Correcto!';
      const nx = $('#nx'); nx.hidden = false;
      nx.textContent = (i === T.preguntas.length - 1) ? 'Ver mi pista ✨' : 'Siguiente';
      nx.onclick = () => go('trivia', { q: i + 1 });
    } else {
      b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
      $('#fb').textContent = 'Mmm, esa no 😏 intenta otra vez';
      buzz(80);
    }
  });
}

/* ---------- Pantalla de espera (pista + countdown) ---------- */
function waitView(num, pista, next) {
  app.innerHTML = `<div class="card">
    <p class="eyebrow">Reto ${num} completado ✅</p>
    <h2>Tu pista ${num}</h2>
    <div class="pista">${pista}</div>
    <p class="muted" style="text-align:center;margin:0">El siguiente reto se desbloquea en</p>
    <div class="cd" id="cd">--:--:--</div>
    <button class="btn" id="nx" disabled>Aún no… 👀</button>
    <p class="muted small" style="text-align:center;margin-top:14px">Puedes cerrar la página y volver, tu progreso se guarda.</p>
  </div>`;
  let rang = false;
  const upd = () => {
    const left = S.unlockAt - Date.now();
    if (left > 0) { $('#cd').textContent = fmt(left); return; }
    clearInterval(timer);
    $('#cd').textContent = '¡Ya! 🎉';
    const nx = $('#nx'); nx.disabled = false; nx.textContent = 'Ir al siguiente reto';
    nx.onclick = () => go(next);
    if (!rang) { rang = true; buzz([200, 100, 200, 100, 400]); document.title = '🔔 ¡Nuevo reto!'; }
  };
  timer = setInterval(upd, 250); upd();
}

/* ---------- Reto 2: memorama ---------- */
function memoView() {
  const M = CONFIG.memorama;
  const deck = shuffle(M.pares.flatMap((p, id) => [{ id, p }, { id, p }]));
  const front = p => p.img
    ? `<img src="${p.img}" alt="" onerror="this.replaceWith(document.createTextNode('${p.emoji || '❤️'}'))">`
    : (p.emoji || '❤️');
  app.innerHTML = `<div class="card">
    <p class="eyebrow">${M.titulo}</p>
    <p class="muted">${M.intro}</p>
    <div class="grid" id="grid">${deck.map(c => `<button class="mc" data-id="${c.id}"><span class="in"><span class="face back">?</span><span class="face front">${front(c.p)}</span></span></button>`).join('')}</div>
    <div class="cap" id="cap"></div>
  </div>`;
  let first = null, lock = false, matched = 0;
  $('#grid').addEventListener('click', e => {
    const b = e.target.closest('.mc');
    if (!b || lock || b.classList.contains('up')) return;
    b.classList.add('up');
    if (!first) { first = b; return; }
    lock = true;
    if (first.dataset.id === b.dataset.id) {
      first.classList.add('done'); b.classList.add('done');
      $('#cap').textContent = M.pares[+b.dataset.id].texto || '';
      buzz(60); matched++; first = null; lock = false;
      if (matched === M.pares.length) setTimeout(() => go('wait2', { unlockAt: Date.now() + WAIT_MS }), 1400);
    } else {
      const a = first;
      setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); first = null; lock = false; }, 800);
    }
  });
}

/* ---------- Reto 3: mapa caliente / frío ---------- */
const toRad = d => d * Math.PI / 180;
function haversine(a, b, c, d) {
  const R = 6371000, dLat = toRad(c - a), dLng = toRad(d - b);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a)) * Math.cos(toRad(c)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function getDest() { return atob(CONFIG.mapa.destinoB64).split(',').map(Number); }

function mapView() {
  const MP = CONFIG.mapa;
  const [DLAT, DLNG] = getDest();
  app.innerHTML = `<div class="card">
    <p class="eyebrow">${MP.titulo}</p>
    <p class="muted">${MP.intro}</p>
    <details><summary>Mis pistas hasta ahora</summary>
      <p>1️⃣ ${CONFIG.trivia.pista}</p><p>2️⃣ ${CONFIG.memorama.pista}</p><p id="extra" hidden></p>
    </details>
    <div id="temp"><div class="big">📍 Pon tu pin</div><div class="muted small" id="tsub">Toca el mapa y luego confirma</div></div>
    <div id="map"></div>
    <button class="btn" id="ok" disabled>Confirmar pin</button>
    <p class="muted small" style="text-align:center;margin:10px 0 0" id="tries">Intentos: 0</p>
  </div>`;
  const map = L.map('map').setView([20.6736, -103.344], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  setTimeout(() => map.invalidateSize(), 150);
  let marker = null, tries = 0, busy = false;
  map.on('click', e => {
    if (busy) return;
    if (!marker) marker = L.marker(e.latlng, { draggable: true }).addTo(map); else marker.setLatLng(e.latlng);
    $('#ok').disabled = false;
  });
  $('#ok').onclick = () => {
    if (!marker || busy) return;
    const p = marker.getLatLng();
    const d = haversine(p.lat, p.lng, DLAT, DLNG);
    tries++; $('#tries').textContent = 'Intentos: ' + tries;
    const band = MP.rangos.find(r => d <= r.hasta);
    const t = $('#temp');
    t.style.background = band.color + '33'; t.style.borderColor = band.color;
    t.innerHTML = `<div class="big">${band.emoji} ${band.label}</div><div class="muted small">${d <= MP.radioGanar ? '¡Aquí es!' : 'Sigue intentando'}</div>`;
    L.circleMarker(p, { radius: 9, color: band.color, fillColor: band.color, fillOpacity: .55, weight: 2 }).addTo(map);
    buzz(d <= MP.radioGanar ? [100, 60, 100, 60, 300] : d <= 1200 ? [120, 60, 120] : 60);
    if (tries === MP.pistaExtraTrasIntentos && MP.pistaExtra) { const x = $('#extra'); x.textContent = MP.pistaExtra; x.hidden = false; }
    if (d <= MP.radioGanar) { busy = true; $('#ok').disabled = true; setTimeout(() => go('final'), 1500); }
  };
}

/* ---------- Final ---------- */
function finalView() {
  const F = CONFIG.mapa.final, [lat, lng] = getDest();
  app.innerHTML = `<div class="card">
    <div class="final-emoji">❤️</div>
    <h1 style="text-align:center">${F.titulo}</h1>
    <p style="text-align:center">${F.texto}</p>
    <div class="pista" style="text-align:center">📍 ${F.lugar}<br>🕖 ${F.hora}</div>
    <a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}">Abrir en Google Maps</a>
  </div>`;
  buzz([200, 100, 200, 100, 600]);
  const em = ['❤️', '✨', '🎉', '💫', '🌸'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 1.5) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 8000);
  }
}

/* ---------- Panel de pruebas: abre la página con ?debug=1 (y &wait=0.1 para esperas de 6 s) ---------- */
if (DEBUG) {
  const d = document.createElement('div'); d.id = 'dbg';
  d.innerHTML = `<b>DEBUG</b>
    <button id="d1">Saltar countdown</button>
    <select id="d2">${['home','trivia','wait1','memo','wait2','map','final'].map(s => `<option>${s}</option>`).join('')}</select>
    <button id="d3">Ir a etapa</button>
    <button id="d4">Reset</button>`;
  document.body.appendChild(d);
  $('#d1').onclick = () => { S.unlockAt = Date.now(); save(); };
  $('#d3').onclick = () => go($('#d2').value, { unlockAt: Date.now() + WAIT_MS, q: 0 });
  $('#d4').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); render(); };
}

render();
</script>
</body>
</html>
